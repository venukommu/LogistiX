name: LogistiX CI

on:
  push:
    branches: [ "master", "main", "feat/*", "release/*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build and Verify Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean test-compile --file backend/pom.xml
