name: Bug report
description: Create a report to help us improve the LogistiX framework
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with LogistiX! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: LogistiX Version
      description: What version of LogistiX are you using? (e.g., 0.1.0-RC2)
      placeholder: 0.1.0-RC2
    validations:
      required: true
  - type: input
    id: java_version
    attributes:
      label: Java Version
      description: What JDK version and vendor? (e.g., Temurin JDK 21.0.2)
      placeholder: OpenJDK 21
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code sample or instructions to reproduce the issue.
      placeholder: |
        1. Define DecisionPipeline...
        2. Execute LogistiX.decision("...")...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
