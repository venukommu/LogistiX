services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: logistix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistix
      POSTGRES_USER: logistix_user
      POSTGRES_PASSWORD: logistix_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistix_user -d logistix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
